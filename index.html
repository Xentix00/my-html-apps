<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Exam Practice Center</title>
<style>
  /* ===== RESET & ROOT ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #060a12;
    --surface: #0c1220;
    --surface2: #111827;
    --surface3: #1a2540;
    --border: #1e2d47;
    --border2: #253352;
    --accent: #38bdf8;
    --accent2: #0ea5e9;
    --accent-dim: rgba(56,189,248,0.12);
    --indigo: #818cf8;
    --success: #34d399;
    --success-dim: rgba(52,211,153,0.12);
    --error: #f87171;
    --error-dim: rgba(248,113,113,0.12);
    --warning: #fbbf24;
    --warning-dim: rgba(251,191,36,0.12);
    --flag: #fb923c;
    --flag-dim: rgba(251,146,60,0.15);
    --text: #f1f5f9;
    --text2: #94a3b8;
    --text3: #64748b;
    --radius: 10px;
    --radius-lg: 16px;
    --shadow: 0 4px 24px rgba(0,0,0,0.5);
    --shadow-lg: 0 8px 48px rgba(0,0,0,0.6);
    --font: 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* ===== HEADER ===== */
  #site-header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(6,10,18,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    display: flex; align-items: center; gap: 16px;
    height: 60px;
    box-shadow: 0 1px 20px rgba(0,0,0,0.4);
  }
  .site-logo {
    font-size: 17px; font-weight: 700; color: var(--accent);
    letter-spacing: -0.3px; white-space: nowrap;
    display: flex; align-items: center; gap: 8px;
  }
  .site-logo svg { flex-shrink: 0; }
  .subject-tabs {
    display: flex; gap: 4px; flex: 1;
  }
  .tab-btn {
    padding: 7px 18px; border-radius: 8px; border: 1px solid transparent;
    background: transparent; color: var(--text2); cursor: pointer;
    font-size: 14px; font-weight: 500; font-family: var(--font);
    transition: all 0.2s; white-space: nowrap;
  }
  .tab-btn:hover { background: var(--surface2); color: var(--text); }
  .tab-btn.active {
    background: var(--accent-dim); border-color: var(--accent);
    color: var(--accent); font-weight: 600;
  }
  .header-timer {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text2); white-space: nowrap;
  }
  .timer-value {
    font-size: 16px; font-weight: 700; color: var(--text);
    font-variant-numeric: tabular-nums; letter-spacing: 0.5px;
    min-width: 60px; text-align: right;
  }
  .timer-value.urgent { color: var(--error); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

  /* ===== MAIN LAYOUT ===== */
  #main { max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; }

  /* ===== INTRO SCREEN ===== */
  .intro-screen {
    animation: fadeUp 0.4s ease;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(16px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .intro-hero {
    text-align: center; padding: 48px 24px 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    margin-bottom: 24px;
  }
  .subject-badge {
    display: inline-block;
    padding: 6px 16px; border-radius: 20px;
    font-size: 12px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; margin-bottom: 16px;
  }
  .bio-badge  { background: rgba(52,211,153,0.15); color: var(--success); border: 1px solid rgba(52,211,153,0.3); }
  .eng-badge  { background: rgba(129,140,248,0.15); color: var(--indigo); border: 1px solid rgba(129,140,248,0.3); }
  .bib-badge  { background: rgba(251,191,36,0.15); color: var(--warning); border: 1px solid rgba(251,191,36,0.3); }
  .intro-title { font-size: 30px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
  .intro-sub   { font-size: 15px; color: var(--text2); margin-bottom: 32px; }
  .intro-stats {
    display: flex; justify-content: center; gap: 32px; flex-wrap: wrap;
    margin-bottom: 32px;
  }
  .stat-item { text-align: center; }
  .stat-num { font-size: 28px; font-weight: 800; color: var(--accent); }
  .stat-label { font-size: 12px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; }
  .start-btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 40px; border-radius: var(--radius);
    background: var(--accent); color: #020b12;
    font-size: 16px; font-weight: 700; font-family: var(--font);
    border: none; cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(56,189,248,0.35);
  }
  .start-btn:hover { background: var(--accent2); transform: translateY(-1px); box-shadow: 0 6px 28px rgba(56,189,248,0.45); }
  .intro-instructions {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 28px;
  }
  .intro-instructions h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--accent); }
  .instruction-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .instruction-list li {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 14px; color: var(--text2);
  }
  .instruction-list li .icon { color: var(--accent); font-size: 16px; flex-shrink: 0; margin-top: 1px; }

  /* ===== EXAM SCREEN ===== */
  .exam-screen { animation: fadeUp 0.3s ease; }
  .exam-topbar {
    position: sticky; top: 60px; z-index: 90;
    background: rgba(6,10,18,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 0; margin-bottom: 28px;
  }
  .progress-info {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; font-size: 13px; color: var(--text2);
  }
  .progress-bar-track {
    height: 5px; background: var(--surface3); border-radius: 3px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), var(--indigo));
    transition: width 0.3s ease;
  }

  /* ===== QUESTION CARD ===== */
  .question-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 28px;
    margin-bottom: 16px; transition: border-color 0.2s;
    position: relative;
  }
  .question-card.answered { border-color: var(--border2); }
  .question-card.flagged { border-color: var(--flag); }
  .question-card.flagged::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 4px; height: 100%; border-radius: var(--radius-lg) 0 0 var(--radius-lg);
    background: var(--flag);
  }
  .q-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 14px; gap: 12px;
  }
  .q-number {
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--text3); flex-shrink: 0;
  }
  .q-type-badge {
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; padding: 3px 8px; border-radius: 4px;
  }
  .q-type-mc { background: var(--accent-dim); color: var(--accent); }
  .q-type-tf { background: rgba(129,140,248,0.12); color: var(--indigo); }
  .q-header-right { display: flex; align-items: center; gap: 8px; }
  .flag-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border2);
    background: transparent; color: var(--text3); cursor: pointer;
    font-size: 12px; font-family: var(--font); transition: all 0.2s;
  }
  .flag-btn:hover { border-color: var(--flag); color: var(--flag); background: var(--flag-dim); }
  .flag-btn.flagged { border-color: var(--flag); color: var(--flag); background: var(--flag-dim); font-weight: 600; }
  .q-text { font-size: 16px; font-weight: 500; margin-bottom: 20px; line-height: 1.6; }
  .q-options { display: flex; flex-direction: column; gap: 10px; }
  .option-label {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface2);
    cursor: pointer; transition: all 0.2s; user-select: none;
  }
  .option-label:hover { border-color: var(--border2); background: var(--surface3); }
  .option-label input[type="radio"] { display: none; }
  .option-indicator {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--border2); background: transparent;
    flex-shrink: 0; transition: all 0.2s; margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
  }
  .option-label input:checked ~ .option-indicator {
    border-color: var(--accent); background: var(--accent);
  }
  .option-label input:checked ~ .option-indicator::after {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: #020b12; display: block;
  }
  .option-label:has(input:checked) {
    border-color: var(--accent); background: var(--accent-dim);
  }
  .option-text { font-size: 14px; line-height: 1.55; }

  /* ===== QUESTION NAV (floating dot panel) ===== */
  #q-nav-panel {
    position: fixed; right: 20px; top: 50%;
    transform: translateY(-50%);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 16px; z-index: 80;
    max-height: 70vh; overflow-y: auto;
    box-shadow: var(--shadow-lg);
    width: 220px;
    display: none;
  }
  #q-nav-panel.visible { display: block; }
  .q-nav-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom: 12px; }
  .q-dots { display: flex; flex-wrap: wrap; gap: 6px; }
  .q-dot {
    width: 30px; height: 30px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface2);
    font-size: 11px; font-weight: 600; color: var(--text3);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s;
  }
  .q-dot:hover { border-color: var(--accent); color: var(--accent); }
  .q-dot.answered { background: rgba(56,189,248,0.15); border-color: var(--accent); color: var(--accent); }
  .q-dot.flagged  { background: var(--flag-dim); border-color: var(--flag); color: var(--flag); }
  .q-dot.answered.flagged { background: var(--flag-dim); border-color: var(--flag); color: var(--flag); }
  .nav-legend { display: flex; flex-direction: column; gap: 5px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text3); }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .legend-dot.ans  { background: rgba(56,189,248,0.4); border: 1px solid var(--accent); }
  .legend-dot.flg  { background: var(--flag-dim); border: 1px solid var(--flag); }
  .legend-dot.una  { background: var(--surface3); border: 1px solid var(--border); }

  /* ===== EXAM FOOTER ===== */
  .exam-footer { padding: 32px 0 0; display: flex; justify-content: center; }
  .finish-btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 16px 48px; border-radius: var(--radius);
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: #fff; font-size: 16px; font-weight: 700;
    font-family: var(--font); border: none; cursor: pointer;
    transition: all 0.2s; box-shadow: 0 4px 20px rgba(239,68,68,0.35);
  }
  .finish-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(239,68,68,0.45); }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 32px; max-width: 480px; width: 100%;
    box-shadow: var(--shadow-lg); animation: scaleIn 0.2s ease;
  }
  @keyframes scaleIn { from{transform:scale(0.94);opacity:0} to{transform:scale(1);opacity:1} }
  .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
  .modal-body  { font-size: 14px; color: var(--text2); margin-bottom: 24px; line-height: 1.65; }
  .modal-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
  .modal-stat  { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
  .modal-stat .n { font-size: 22px; font-weight: 800; }
  .modal-stat .l { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; }
  .modal-stat.warn .n { color: var(--warning); }
  .modal-stat.ok   .n { color: var(--success); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .btn-secondary {
    padding: 10px 20px; border-radius: 8px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text2); cursor: pointer; font-size: 14px; font-family: var(--font);
    transition: all 0.2s;
  }
  .btn-secondary:hover { border-color: var(--border2); color: var(--text); }
  .btn-danger {
    padding: 10px 24px; border-radius: 8px;
    background: #ef4444; border: none; color: #fff;
    cursor: pointer; font-size: 14px; font-weight: 600; font-family: var(--font);
    transition: all 0.2s;
  }
  .btn-danger:hover { background: #dc2626; }

  /* ===== RESULTS SCREEN ===== */
  .results-screen { animation: fadeUp 0.4s ease; }
  .results-hero {
    text-align: center; padding: 48px 24px 36px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); margin-bottom: 24px;
  }
  .grade-circle {
    width: 110px; height: 110px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 36px; font-weight: 900;
    border: 4px solid;
  }
  .grade-A { border-color: var(--success); color: var(--success); background: rgba(52,211,153,0.1); }
  .grade-B { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .grade-C { border-color: var(--warning); color: var(--warning); background: var(--warning-dim); }
  .grade-D, .grade-F { border-color: var(--error); color: var(--error); background: var(--error-dim); }
  .results-score { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .results-sub   { font-size: 14px; color: var(--text2); }
  .results-stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px; margin-top: 28px;
  }
  .r-stat {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; text-align: center;
  }
  .r-stat .n { font-size: 22px; font-weight: 800; color: var(--accent); }
  .r-stat .l { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  .review-section { margin-top: 16px; }
  .review-title { font-size: 20px; font-weight: 800; margin-bottom: 16px; }
  .review-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 24px; margin-bottom: 12px;
    animation: fadeUp 0.3s ease;
  }
  .review-card.correct { border-left: 4px solid var(--success); }
  .review-card.incorrect { border-left: 4px solid var(--error); }
  .review-q-num { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
  .review-q-text { font-size: 15px; font-weight: 500; margin-bottom: 14px; }
  .review-answers { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .review-ans {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 8px; font-size: 13px;
  }
  .review-ans.user-correct { background: var(--success-dim); border: 1px solid rgba(52,211,153,0.3); color: var(--success); }
  .review-ans.user-wrong   { background: var(--error-dim);   border: 1px solid rgba(248,113,113,0.3); color: var(--error); }
  .review-ans.show-correct { background: var(--success-dim); border: 1px solid rgba(52,211,153,0.3); color: var(--success); }
  .review-ans.unanswered   { background: var(--surface2); border: 1px solid var(--border); color: var(--text3); }
  .review-explanation {
    padding: 10px 14px; border-radius: 8px;
    background: rgba(56,189,248,0.07); border: 1px solid rgba(56,189,248,0.15);
    font-size: 13px; color: var(--text2); line-height: 1.6;
  }
  .review-explanation strong { color: var(--accent); }
  .retake-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 13px 32px; border-radius: var(--radius);
    background: var(--accent); color: #020b12;
    font-size: 15px; font-weight: 700; font-family: var(--font);
    border: none; cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(56,189,248,0.3);
    margin-top: 28px;
  }
  .retake-btn:hover { background: var(--accent2); }

  /* ===== RESPONSIVE ===== */
  @media (min-width: 1100px) { #q-nav-panel.visible { display: block; } }
  @media (max-width: 640px) {
    #site-header { gap: 8px; padding: 0 12px; }
    .site-logo span { display: none; }
    .tab-btn { padding: 6px 12px; font-size: 13px; }
    .intro-stats { gap: 16px; }
    .stat-num { font-size: 22px; }
    #main { padding: 20px 12px 60px; }
    .question-card { padding: 20px; }
    .q-text { font-size: 15px; }
    .results-stats-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 400px) {
    .tab-btn { padding: 5px 8px; font-size: 12px; }
  }

  /* ===== UTILITY ===== */
  .hidden { display: none !important; }
  .text-success { color: var(--success); }
  .text-error   { color: var(--error); }
  .text-warning { color: var(--warning); }
  .text-accent  { color: var(--accent); }
</style>

<body>

<!-- ===== HEADER ===== -->
<header id="site-header">
  <div class="site-logo">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <rect x="1" y="1" width="20" height="20" rx="5" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M6 11h10M11 6v10" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span>Exam Prep</span>
  </div>
  <nav class="subject-tabs">
    <button class="tab-btn active" data-subject="biology">Biology</button>
    <button class="tab-btn" data-subject="english">English</button>
    <button class="tab-btn" data-subject="bible">Bible</button>
  </nav>
  <div class="header-timer hidden" id="header-timer">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="9" r="6" stroke="#94a3b8" stroke-width="1.3"/>
      <path d="M8 6v3l2 1.5" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M6 2h4" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    <span class="timer-value" id="timer-display">2:00:00</span>
  </div>
</header>

<!-- ===== QUESTION NAVIGATOR PANEL ===== -->
<div id="q-nav-panel">
  <div class="q-nav-title">Questions</div>
  <div class="q-dots" id="q-dots"></div>
  <div class="nav-legend">
    <div class="legend-item"><div class="legend-dot ans"></div>Answered</div>
    <div class="legend-item"><div class="legend-dot flg"></div>Flagged</div>
    <div class="legend-item"><div class="legend-dot una"></div>Unanswered</div>
  </div>
</div>

<!-- ===== MAIN ===== -->
<main id="main">
  <div id="content-area"></div>
</main>

<!-- ===== MODAL ===== -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal-box" id="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-stats hidden" id="modal-stats"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script>
/* =========================================================
   DATA: ALL EXAM QUESTIONS
   ========================================================= */

const EXAM_DATA = {

  // -------------------------------------------------------
  // BIOLOGY – 42 questions
  // -------------------------------------------------------

/* =========================================================
   APP STATE
   ========================================================= */
let state = {
  subject: 'biology',
  phase: 'intro',       // 'intro' | 'exam' | 'results'
  questions: [],        // shuffled question objects with shuffled options
  answers: {},          // { qIndex: selectedOption }
  flags: {},            // { qIndex: true }
  timerSeconds: 7200,
  timerInterval: null,
  startTime: null,
  endTime: null
};

/* =========================================================
   UTILITY
   ========================================================= */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatTime(secs) {
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function elapsedFormatted() {
  if (!state.startTime) return '0:00:00';
  const diff = Math.floor(((state.endTime || Date.now()) - state.startTime) / 1000);
  return formatTime(diff);
}

function getLetterGrade(pct) {
  if (pct >= 90) return 'A';
  if (pct >= 80) return 'B';
  if (pct >= 70) return 'C';
  if (pct >= 60) return 'D';
  return 'F';
}

/* =========================================================
   RENDER: INTRO
   ========================================================= */
function renderIntro() {
  const data = EXAM_DATA[state.subject];
  const count = data.questions.length;
  const content = document.getElementById('content-area');
  content.innerHTML = `
    <div class="intro-screen">
      <div class="intro-hero">
        <div class="subject-badge ${data.badgeClass}">${data.badgeText}</div>
        <h1 class="intro-title">${data.name} Final Exam</h1>
        <p class="intro-sub">9th Grade · Comprehensive Practice Exam</p>
        <div class="intro-stats">
          <div class="stat-item"><div class="stat-num">${count}</div><div class="stat-label">Questions</div></div>
          <div class="stat-item"><div class="stat-num">2:00</div><div class="stat-label">Time Limit</div></div>
          <div class="stat-item"><div class="stat-num">MC + T/F</div><div class="stat-label">Question Types</div></div>
        </div>
        <button class="start-btn" id="start-btn">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <polygon points="5,3 15,9 5,15" fill="currentColor"/>
          </svg>
          Begin Exam
        </button>
      </div>
      <div class="intro-instructions">
        <h3>Instructions</h3>
        <ul class="instruction-list">
          <li><span class="icon">⏱</span>You have <strong style="color:var(--text)">2 hours</strong> to complete this exam. The timer starts when you click "Begin Exam."</li>
          <li><span class="icon">🔀</span>Questions and answer choices are randomly shuffled every session for authentic practice.</li>
          <li><span class="icon">🚩</span>Use the <strong style="color:var(--text)">Flag</strong> button to mark questions you want to review later.</li>
          <li><span class="icon">📊</span>A progress bar and question navigator track your completion in real time.</li>
          <li><span class="icon">✏️</span>You may freely change any answer before submitting.</li>
          <li><span class="icon">✅</span>Click <strong style="color:var(--text)">Finish Exam</strong> when done. You will receive instant results with explanations.</li>
          <li><span class="icon">⚠️</span>If time runs out, your exam will be auto-submitted.</li>
        </ul>
      </div>
    </div>
  `;
  document.getElementById('start-btn').addEventListener('click', startExam);
  document.getElementById('q-nav-panel').classList.remove('visible');
  document.getElementById('header-timer').classList.add('hidden');
}

/* =========================================================
   START EXAM
   ========================================================= */
function startExam() {
  const data = EXAM_DATA[state.subject];
  // Shuffle questions
  state.questions = shuffle(data.questions).map((q, i) => {
    const opts = q.type === 'tf' ? [...q.options] : shuffle([...q.options]);
    return { ...q, options: opts, origIndex: i };
  });
  state.answers = {};
  state.flags = {};
  state.phase = 'exam';
  state.timerSeconds = data.timeLimit;
  state.startTime = Date.now();
  state.endTime = null;

  renderExam();
  startTimer();
  document.getElementById('header-timer').classList.remove('hidden');
  if (window.innerWidth >= 1100) {
    document.getElementById('q-nav-panel').classList.add('visible');
  }
}

/* =========================================================
   RENDER: EXAM
   ========================================================= */
function renderExam() {
  const content = document.getElementById('content-area');
  const qs = state.questions;

  let qHTML = qs.map((q, i) => `
    <div class="question-card" id="qcard-${i}" data-index="${i}">
      <div class="q-header">
        <span class="q-number">Question ${i + 1} of ${qs.length}</span>
        <div class="q-header-right">
          <span class="q-type-badge ${q.type === 'mc' ? 'q-type-mc' : 'q-type-tf'}">${q.type === 'mc' ? 'Multiple Choice' : 'True / False'}</span>
          <button class="flag-btn" id="flag-btn-${i}" onclick="toggleFlag(${i})">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M2 1v10M2 1h7l-2 3.5L9 8H2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Flag
          </button>
        </div>
      </div>
      <p class="q-text">${q.q}</p>
      <div class="q-options">
        ${q.options.map(opt => `
          <label class="option-label">
            <input type="radio" name="q${i}" value="${escHtml(opt)}" onchange="selectAnswer(${i}, '${escHtml(opt).replace(/'/g,"\\'")}')">
            <div class="option-indicator"></div>
            <span class="option-text">${opt}</span>
          </label>
        `).join('')}
      </div>
    </div>
  `).join('');

  content.innerHTML = `
    <div class="exam-screen">
      <div class="exam-topbar">
        <div class="progress-info">
          <span id="prog-answered">0 answered</span>
          <span id="prog-remain">${qs.length} remaining</span>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>
      <div id="questions-container">${qHTML}</div>
      <div class="exam-footer">
        <button class="finish-btn" id="finish-btn">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M4 9h10M9 4l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Finish Exam
        </button>
      </div>
    </div>
  `;

  document.getElementById('finish-btn').addEventListener('click', handleFinishClick);
  updateNavPanel();
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* =========================================================
   ANSWER SELECTION
   ========================================================= */
function selectAnswer(qIndex, optVal) {
  state.answers[qIndex] = optVal;
  updateProgress();
  updateNavPanel();
  const card = document.getElementById(`qcard-${qIndex}`);
  if (card) card.classList.add('answered');
}

function toggleFlag(qIndex) {
  state.flags[qIndex] = !state.flags[qIndex];
  const btn = document.getElementById(`flag-btn-${qIndex}`);
  const card = document.getElementById(`qcard-${qIndex}`);
  if (state.flags[qIndex]) {
    btn.classList.add('flagged');
    btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M2 1v10M2 1h7l-2 3.5L9 8H2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg> Flagged`;
    card.classList.add('flagged');
  } else {
    btn.classList.remove('flagged');
    btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 1v10M2 1h7l-2 3.5L9 8H2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg> Flag`;
    card.classList.remove('flagged');
  }
  updateNavPanel();
}

/* =========================================================
   PROGRESS
   ========================================================= */
function updateProgress() {
  const total = state.questions.length;
  const answered = Object.keys(state.answers).length;
  const remain = total - answered;
  const pct = total > 0 ? (answered / total) * 100 : 0;
  const fillEl = document.getElementById('progress-fill');
  const ansEl  = document.getElementById('prog-answered');
  const remEl  = document.getElementById('prog-remain');
  if (fillEl) fillEl.style.width = pct + '%';
  if (ansEl)  ansEl.textContent = `${answered} answered`;
  if (remEl)  remEl.textContent = `${remain} remaining`;
}

/* =========================================================
   NAV PANEL
   ========================================================= */
function updateNavPanel() {
  const dots = document.getElementById('q-dots');
  if (!dots) return;
  dots.innerHTML = state.questions.map((_, i) => {
    let cls = 'q-dot';
    if (state.answers[i] !== undefined) cls += ' answered';
    if (state.flags[i]) cls += ' flagged';
    return `<div class="${cls}" title="Question ${i+1}" onclick="scrollToQ(${i})">${i+1}</div>`;
  }).join('');
}

function scrollToQ(i) {
  const el = document.getElementById(`qcard-${i}`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* =========================================================
   TIMER
   ========================================================= */
function startTimer() {
  clearInterval(state.timerInterval);
  updateTimerDisplay();
  state.timerInterval = setInterval(() => {
    state.timerSeconds--;
    updateTimerDisplay();
    if (state.timerSeconds <= 0) {
      clearInterval(state.timerInterval);
      autoSubmit();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const el = document.getElementById('timer-display');
  if (!el) return;
  el.textContent = formatTime(state.timerSeconds);
  if (state.timerSeconds <= 300) {
    el.classList.add('urgent');
  } else {
    el.classList.remove('urgent');
  }
}

function stopTimer() {
  clearInterval(state.timerInterval);
  state.endTime = Date.now();
}

/* =========================================================
   FINISH / SUBMIT FLOW
   ========================================================= */
function handleFinishClick() {
  const total = state.questions.length;
  const answered = Object.keys(state.answers).length;
  const unanswered = total - answered;
  const flagged = Object.values(state.flags).filter(Boolean).length;

  const statsHTML = `
    <div class="modal-stats" id="modal-stats">
      <div class="modal-stat ${unanswered > 0 ? 'warn' : 'ok'}">
        <div class="n">${unanswered}</div>
        <div class="l">Unanswered</div>
      </div>
      <div class="modal-stat">
        <div class="n" style="color:var(--flag)">${flagged}</div>
        <div class="l">Flagged</div>
      </div>
      <div class="modal-stat ok">
        <div class="n">${answered}</div>
        <div class="l">Answered</div>
      </div>
      <div class="modal-stat">
        <div class="n" style="color:var(--text2)">${total}</div>
        <div class="l">Total</div>
      </div>
    </div>
  `;

  const body = unanswered > 0
    ? `You have <strong style="color:var(--warning)">${unanswered} unanswered question${unanswered !== 1 ? 's' : ''}</strong>. ${flagged > 0 ? `You also have <strong style="color:var(--flag)">${flagged} flagged question${flagged !== 1 ? 's' : ''}</strong> to review. ` : ''}Are you sure you want to submit?`
    : flagged > 0
      ? `All questions are answered! You still have <strong style="color:var(--flag)">${flagged} flagged question${flagged !== 1 ? 's' : ''}</strong>. Ready to submit?`
      : 'All questions answered. Ready to submit your exam?';

  showModal(
    'Submit Exam?',
    body + statsHTML,
    [
      { label: 'Go Back', cls: 'btn-secondary', action: closeModal },
      { label: 'Submit Now', cls: 'btn-danger', action: submitExam }
    ]
  );
}

function autoSubmit() {
  closeModal();
  submitExam();
}

function submitExam() {
  closeModal();
  stopTimer();
  state.phase = 'results';
  renderResults();
  document.getElementById('q-nav-panel').classList.remove('visible');
  document.getElementById('header-timer').classList.add('hidden');
}

/* =========================================================
   MODAL
   ========================================================= */
function showModal(title, bodyHtml, actions) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  const actionsEl = document.getElementById('modal-actions');
  actionsEl.innerHTML = actions.map((a, i) =>
    `<button class="${a.cls}" id="modal-action-${i}">${a.label}</button>`
  ).join('');
  actions.forEach((a, i) => {
    document.getElementById(`modal-action-${i}`).addEventListener('click', a.action);
  });
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

/* =========================================================
   RENDER: RESULTS
   ========================================================= */
function renderResults() {
  const qs = state.questions;
  let correct = 0;
  qs.forEach((q, i) => {
    if (state.answers[i] === q.answer) correct++;
  });
  const total = qs.length;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  const grade = getLetterGrade(pct);
  const elapsed = elapsedFormatted();

  const data = EXAM_DATA[state.subject];

  // Grade circle color class
  let gradeClass = 'grade-A';
  if (grade === 'B') gradeClass = 'grade-B';
  else if (grade === 'C') gradeClass = 'grade-C';
  else if (grade === 'D' || grade === 'F') gradeClass = 'grade-D';

  const reviewHTML = qs.map((q, i) => {
    const userAns = state.answers[i];
    const isCorrect = userAns === q.answer;
    const cardCls = isCorrect ? 'review-card correct' : 'review-card incorrect';

    let userRow = '';
    if (userAns === undefined) {
      userRow = `<div class="review-ans unanswered">⚠ Not answered</div>`;
    } else if (isCorrect) {
      userRow = `<div class="review-ans user-correct">✓ Your answer: ${escHtml(userAns)}</div>`;
    } else {
      userRow = `<div class="review-ans user-wrong">✗ Your answer: ${escHtml(userAns)}</div>`;
    }

    let correctRow = '';
    if (!isCorrect) {
      correctRow = `<div class="review-ans show-correct">✓ Correct answer: ${escHtml(q.answer)}</div>`;
    }

    return `
      <div class="${cardCls}">
        <div class="review-q-num">Question ${i + 1} · ${q.type === 'mc' ? 'Multiple Choice' : 'True / False'} · ${isCorrect ? '<span style="color:var(--success)">Correct</span>' : '<span style="color:var(--error)">Incorrect</span>'}</div>
        <div class="review-q-text">${q.q}</div>
        <div class="review-answers">${userRow}${correctRow}</div>
        <div class="review-explanation"><strong>Explanation:</strong> ${q.exp}</div>
      </div>
    `;
  }).join('');

  document.getElementById('content-area').innerHTML = `
    <div class="results-screen">
      <div class="results-hero">
        <div class="subject-badge ${data.badgeClass}">${data.badgeText}</div>
        <div class="grade-circle ${gradeClass}">${grade}</div>
        <div class="results-score">${pct}% — ${correct} / ${total} Correct</div>
        <div class="results-sub">Final Exam Score · ${data.name}</div>
        <div class="results-stats-grid">
          <div class="r-stat"><div class="n" style="color:var(--success)">${correct}</div><div class="l">Correct</div></div>
          <div class="r-stat"><div class="n" style="color:var(--error)">${total - correct}</div><div class="l">Incorrect</div></div>
          <div class="r-stat"><div class="n">${pct}%</div><div class="l">Score</div></div>
          <div class="r-stat"><div class="n" style="color:var(--text2)">${elapsed}</div><div class="l">Time Taken</div></div>
        </div>
        <button class="retake-btn" onclick="retake()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 8C2 4.686 4.686 2 8 2c2.21 0 4.157 1.13 5.293 2.836" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M14 3v4h-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 8c0 3.314-2.686 6-6 6S2 11.314 2 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 2"/>
          </svg>
          Retake Exam
        </button>
      </div>
      <div class="review-section">
        <div class="review-title">Detailed Review</div>
        ${reviewHTML}
      </div>
    </div>
  `;
}

/* =========================================================
   RETAKE
   ========================================================= */
function retake() {
  state.phase = 'intro';
  stopTimer();
  renderIntro();
}

/* =========================================================
   TAB NAVIGATION
   ========================================================= */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (state.phase === 'exam') {
      showModal(
        'Leave Exam?',
        'Switching subjects will end your current exam and your progress will be lost. Are you sure?',
        [
          { label: 'Stay', cls: 'btn-secondary', action: closeModal },
          { label: 'Leave', cls: 'btn-danger', action: () => {
              closeModal();
              stopTimer();
              switchSubject(btn.dataset.subject);
            }
          }
        ]
      );
    } else {
      switchSubject(btn.dataset.subject);
    }
  });
});

function switchSubject(subject) {
  state.subject = subject;
  state.phase = 'intro';
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.subject === subject);
  });
  renderIntro();
}

/* =========================================================
   INIT
   ========================================================= */
renderIntro();
</script>
